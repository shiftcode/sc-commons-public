# Slack app manifest for the shared `shiftcode operations` Slack app used by `AlarmingConstruct`.
#
# The bundled notification lambdas (`publish-alarm-to-slack-fn`, `publish-error-logs-to-slack-fn`) only POST JSON
# payloads (`attachments` / Block Kit `blocks`) to a Slack incoming-webhook URL, so the app needs nothing but the
# `incoming-webhook` scope: no events, no slash commands, no interactivity, no socket mode.
#
# One app serves all projects - add one incoming webhook per operations channel.
# See README.md (section `AlarmingConstruct`) for the setup steps.
#
# Not published to npm: only `dist/` (plus README/CHANGELOG) is part of the package.
# @see https://api.slack.com/reference/manifests
_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: shiftcode operations
  description: CloudWatch alarms and error logs of shiftcode projects, posted by the AlarmingConstruct of @shiftcode/cdk-utilities.
  background_color: '#1d1c1d'
features:
  bot_user:
    display_name: shiftcode operations
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
